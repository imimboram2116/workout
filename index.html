<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상체 B 체크</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --sub: #6b6b70;
    --line: #e4e2dc; --accent: #2f6f4f; --accent-soft: #e3efe8; --warn: #a3471f;
    --body: #e9e6df; --body-line: #b9b4a8; --hit: #1f8a55; --hit2: #8fd1ad; --avoid: #e07a3f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --card: #1f1f21; --text: #f2f2f2; --sub: #a0a0a6;
      --line: #333336; --accent: #6cc297; --accent-soft: #1f3a2c; --warn: #f08a5d;
      --body: #2c2c2f; --body-line: #55555a; --hit: #4fd08f; --hit2: #2f6b4c; --avoid: #f08a5d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
  header h1 { font-size: 22px; margin: 8px 0 2px; }
  header p { margin: 0; color: var(--sub); font-size: 14px; }
  .progress { margin: 14px 0 6px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .progress-label { font-size: 13px; color: var(--sub); }
  .note { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 14px; }
  .card h2 { font-size: 18px; margin: 0; }
  .presc { color: var(--sub); font-size: 14px; margin-top: 2px; }
  .target { margin-top: 8px; font-size: 14px; }
  .target b { color: var(--accent); }
  details { margin-top: 6px; font-size: 14px; }
  summary { cursor: pointer; color: var(--sub); }
  details ul { margin: 6px 0 0; padding-left: 18px; }
  details li { margin: 3px 0; }
  .warn { color: var(--warn); font-weight: 600; }
  .sets { margin-top: 10px; display: grid; gap: 8px; }
  .set {
    display: grid; grid-template-columns: 52px minmax(0,1fr) minmax(0,1fr) 64px; gap: 6px; align-items: center;
    padding: 8px; border: 1px solid var(--line); border-radius: 10px;
  }
  .set.done { background: var(--accent-soft); border-color: var(--accent); }
  .set .no { font-size: 14px; font-weight: 600; }
  .set .no small { display: block; font-weight: 400; color: var(--sub); font-size: 11px; }
  .field { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--sub); }
  .field input {
    width: 100%; min-width: 0; padding: 8px 6px; font-size: 16px; text-align: center;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .check {
    height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--sub); font-size: 14px; font-weight: 600;
  }
  .set.done .check { background: var(--accent); color: #fff; border-color: var(--accent); }
  .memo { width: 100%; margin-top: 10px; padding: 8px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--card); border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: center;
  }
  .bar button { flex: 1; max-width: 260px; height: 46px; border-radius: 10px; font-size: 15px; font-weight: 600; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .bar .primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .photos { display: flex; gap: 8px; margin-top: 10px; justify-content: center; }
  .photos figure { margin: 0; flex: 1; min-width: 0; max-width: 240px; text-align: center; font-size: 12px; color: var(--sub); }
  .photos img { width: 100%; height: 190px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid var(--line); }
  .credits { margin-top: 20px; font-size: 11px; color: var(--sub); }
  .credits a { color: var(--sub); }
  .figs { display: flex; gap: 8px; margin-top: 10px; }
  .fig { flex: 1; min-width: 0; text-align: center; font-size: 12px; color: var(--sub); }
  .fig svg { width: 100%; max-width: 200px; height: auto; display: block; margin: 0 auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--sub); margin-top: 6px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>상체 B (밀기)</h1>
    <p id="date"></p>
  </header>
  <div class="progress"><div id="bar"></div></div>
  <div class="progress-label" id="plabel"></div>
  <div class="note">허리가 뻐근해지면 그 종목에서 바로 멈추기. 서 있는 동안 왼쪽 무릎이 불편하면 ①은 건너뛰고 ②부터.</div>
  <div class="legend"><span><i style="background:var(--hit)"></i>주로 자극</span><span><i style="background:var(--hit2)"></i>같이 쓰임</span><span><i style="background:var(--avoid)"></i>여기가 당기면 자세 점검</span></div>
  <div id="list"></div>
  <textarea class="memo" id="memo" rows="3" placeholder="메모: 무릎, 허리 상태, 자극 위치 등"></textarea>
  <div class="credits">
    그림 출처 (위키미디어 공용):
    <a href="https://commons.wikimedia.org/wiki/File:How_to_do_an_Overhead_Press.jpg">오버헤드 프레스</a> RangerJim, CC BY-SA 4.0 ·
    <a href="https://commons.wikimedia.org/wiki/File:Shoulder-press-machine-1.png">숄더 프레스 머신 1</a>, <a href="https://commons.wikimedia.org/wiki/File:Shoulder-press-machine-2.png">2</a> ·
    <a href="https://commons.wikimedia.org/wiki/File:Dumbbell-lateral-raises-1.png">사이드 래터럴 1</a>, <a href="https://commons.wikimedia.org/wiki/File:Dumbbell-lateral-raises-2.png">2</a> ·
    <a href="https://commons.wikimedia.org/wiki/File:Dumbbell-front-raises-1.png">프론트 레이즈 1</a>, <a href="https://commons.wikimedia.org/wiki/File:Dumbbell-front-raises-2.png">2</a> — Everkinetic, CC BY-SA 3.0 ·
    <a href="https://commons.wikimedia.org/wiki/File:Pec_deck_Fly.jpg">펙덱</a> Aliva Sahoo, CC BY-SA 4.0.
    크기만 줄였고 내용은 고치지 않음. 몸 윤곽 그림은 직접 그린 것.
  </div>
</main>
<div class="bar">
  <button id="reset">초기화</button>
  <button class="primary" id="copy">기록 복사</button>
</div>
<div class="toast" id="toast"></div>

<script>
const EXERCISES = [
  {
    id: "ohp", photos: [ { src: "img/ohp.jpg", cap: "동작 순서 (영문 그림)" } ], figs: [ { view: "front", main: ["frontDelt"], sub: ["sideDelt"], cap: "앞에서 본 모습: 어깨 앞쪽" }, { view: "back", main: ["triceps"], sub: [], cap: "뒤에서 본 모습: 팔 뒤쪽" } ], name: "① 바벨 오버헤드 프레스",
    presc: "15kg × 12~15회 × 2세트 + 10kg × 20회 × 1세트",
    target: "어깨 앞쪽(전면삼각근), 팔 뒤쪽(삼두)",
    cues: [
      { warn: true, t: "허리가 뒤로 꺾이면 그 세트에서 바로 10kg로 내리기" },
      { t: "1세트 뒤 허리가 뻐근하면 2세트째는 10kg" },
      { t: "엉덩이와 배에 힘, 갈비뼈를 내린 채 밀기" },
      { t: "바가 얼굴 앞을 지날 때 머리를 살짝 뒤로, 지나가면 다시 앞으로" },
      { warn: true, t: "무릎은 잠그지 말고 살짝 풀기. 왼쪽 무릎이 불편하면 이 종목은 건너뛰기" }
    ],
    sets: [ { kg: 15, goal: "12~15" }, { kg: 15, goal: "12~15" }, { kg: 10, goal: "20" } ]
  },
  {
    id: "smp", photos: [ { src: "img/smp-1.jpg", cap: "시작" }, { src: "img/smp-2.jpg", cap: "끝" } ], figs: [ { view: "front", main: ["frontDelt"], sub: ["sideDelt"], cap: "어깨 앞쪽이 주로, 옆쪽도 같이" } ], name: "② 숄더 프레스 머신",
    presc: "5kg × 15회 × 3세트",
    target: "어깨 앞쪽~옆쪽",
    cues: [
      { t: "좌석은 조금 높이고, 팔꿈치는 몸통보다 살짝 앞" },
      { t: "등을 등받이에 붙인 채로 밀기" },
      { t: "맨 위에서 팔꿈치를 끝까지 잠그지 않기" }
    ],
    sets: [ { kg: 5, goal: "15" }, { kg: 5, goal: "15" }, { kg: 5, goal: "15" } ]
  },
  {
    id: "lat", photos: [ { src: "img/lat-1.jpg", cap: "시작" }, { src: "img/lat-2.jpg", cap: "끝 (어깨 높이까지)" } ], figs: [ { view: "front", main: ["sideDelt"], sub: [], avoid: ["traps"], cap: "어깨 바깥쪽. 목 옆이 당기면 너무 높이 든 것" } ], name: "③ 덤벨 사이드 래터럴 레이즈",
    presc: "2kg × 15회 × 3세트",
    target: "어깨 바깥쪽(측면삼각근)",
    cues: [
      { t: "어깨 높이까지만. 더 높이면 목 옆(승모근)이 대신 일함" },
      { t: "팔꿈치를 살짝 굽혀 고정, 새끼손가락 쪽이 살짝 위로" },
      { warn: true, t: "반동 쓰지 않기. 몸을 흔들면 허리에 실림 (9/28 이 종목 뒤 허리 뻐근)" },
      { t: "내릴 때 2~3초 천천히" }
    ],
    sets: [ { kg: 2, goal: "15" }, { kg: 2, goal: "15" }, { kg: 2, goal: "15" } ]
  },
  {
    id: "front", photos: [ { src: "img/front-1.jpg", cap: "시작" }, { src: "img/front-2.jpg", cap: "끝 (어깨 높이까지)" } ], figs: [ { view: "front", main: ["frontDelt"], sub: [], cap: "어깨 앞쪽" } ], name: "④ 덤벨 프론트 레이즈",
    presc: "2kg × 15회 × 1세트 (여력 있으면 2세트)",
    target: "어깨 앞쪽",
    cues: [
      { t: "①②에서 어깨 앞쪽을 이미 6세트 씀. 지치면 1세트로 끝" },
      { t: "어깨 높이까지만, 상체를 뒤로 젖히지 않기" }
    ],
    sets: [ { kg: 2, goal: "15" }, { kg: 2, goal: "15", optional: true } ]
  },
  {
    id: "pec", photos: [ { src: "img/pec.jpg", cap: "기구 모습 (센터 기구와 다를 수 있음)" } ], figs: [ { view: "front", main: ["pecOuter"], sub: ["pec"], cap: "겨드랑이 바로 아래, 가슴 바깥쪽" } ], name: "⑤ 펙덱 플라이 (가슴)",
    presc: "10kg × 15회 × 3세트",
    target: "겨드랑이 바로 아래~옆가슴",
    cues: [
      { warn: true, t: "등을 패드에서 떼지 않기" },
      { t: "확인 1: 손잡이가 어깨 높이와 나란한지 (시트 높이)" },
      { t: "확인 2: 팔을 몸 뒤까지 열지 않는지 (벌리는 범위)" },
      { t: "자극이 안 오면 무게보다 범위와 자세를 먼저 고치기" }
    ],
    sets: [ { kg: 10, goal: "15" }, { kg: 10, goal: "15" }, { kg: 10, goal: "15" } ]
  }
];

const today = new Date();
const pad = n => String(n).padStart(2, "0");
const dateKey = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
const STORE = "upperB:" + dateKey;
const days = ["일", "월", "화", "수", "목", "금", "토"];
document.getElementById("date").textContent = `${dateKey} (${days[today.getDay()]}) · 세트 끝날 때마다 횟수 넣고 완료 누르기`;

let state = {};
try { state = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

const SHAPES = {
  // 왼쪽 절반 좌표. 오른쪽은 x=100 기준으로 뒤집어 그린다
  traps: '<path d="M91,44 Q80,50 66,55 L74,60 L92,56 Z"/>',
  frontDelt: '<ellipse cx="65" cy="68" rx="8" ry="13"/>',
  sideDelt: '<ellipse cx="54" cy="68" rx="7" ry="14"/>',
  pec: '<path d="M99,60 L73,61 Q66,76 70,93 Q86,101 99,95 Z"/>',
  pecOuter: '<ellipse cx="75" cy="80" rx="7" ry="13"/>',
  triceps: '<path d="M47,76 Q42,98 44,120 L55,121 Q57,98 59,84 Z"/>',
  backTraps: '<path d="M92,44 L66,55 L84,62 L100,100 L100,44 Z"/>'
};
const BASE_HALF = `
  <path d="M91,40 L91,48 Q80,52 66,55 Q50,56 46,72 L41,122 L37,166 L50,167 L55,124 L60,88 L70,94 L74,150 L100,155 L100,40 Z"/>`;
function bodySvg(fig) {
  const half = (names, cls) => (names || []).map(n => SHAPES[n === "traps" && fig.view === "back" ? "backTraps" : n]).join("").replace(/<(path|ellipse)/g, `<$1 class="${cls}"`);
  const layer = half(fig.sub, "sub") + half(fig.main, "main") + half(fig.avoid, "avoid");
  const side = `<g>${BASE_HALF}</g>${layer}`;
  const detail = fig.view === "front"
    ? '<path d="M100,96 L100,150" class="ln"/><path d="M84,110 L116,110 M86,126 L114,126" class="ln"/>'
    : '<path d="M100,60 L100,150" class="ln"/><path d="M72,92 Q86,104 100,102 Q114,104 128,92" class="ln"/>';
  return `<svg viewBox="30 0 140 172" role="img" aria-label="${fig.cap}">
    <style>
      g path { fill: var(--body); stroke: var(--body-line); stroke-width: 1; }
      .main { fill: var(--hit); } .sub { fill: var(--hit2); }
      .avoid { fill: var(--avoid); opacity: .85; }
      .ln { fill: none; stroke: var(--body-line); stroke-width: 1; }
      .head { fill: var(--body); stroke: var(--body-line); }
    </style>
    <ellipse class="head" cx="100" cy="23" rx="14" ry="17"/>
    ${side}
    <g transform="translate(200,0) scale(-1,1)">${side}</g>
    ${detail}
  </svg>`;
}

const list = document.getElementById("list");
EXERCISES.forEach(ex => {
  const card = document.createElement("section");
  card.className = "card";
  card.innerHTML = `
    <h2>${ex.name}</h2>
    <div class="presc">${ex.presc}</div>
    <div class="photos">${ex.photos.map(p => `<figure><img src="${p.src}" alt="${ex.name} ${p.cap}" loading="lazy"><figcaption>${p.cap}</figcaption></figure>`).join("")}</div>
    <div class="target">자극점: <b>${ex.target}</b></div>
    <div class="figs">${ex.figs.map(f => `<div class="fig">${bodySvg(f)}${f.cap}</div>`).join("")}</div>
    <details><summary>주의점</summary><ul>${ex.cues.map(c => `<li class="${c.warn ? "warn" : ""}">${c.t}</li>`).join("")}</ul></details>
    <div class="sets"></div>`;
  const setsEl = card.querySelector(".sets");
  ex.sets.forEach((s, i) => {
    const key = `${ex.id}-${i}`;
    const st = state[key] || (state[key] = { kg: s.kg, reps: "", done: false });
    const row = document.createElement("div");
    row.className = "set" + (st.done ? " done" : "");
    row.innerHTML = `
      <div class="no">${i + 1}세트<small>${s.optional ? "선택 · " : ""}목표 ${s.goal}</small><small class="at">${st.at ? st.at + " 완료" : ""}</small></div>
      <label class="field"><input type="number" inputmode="decimal" step="0.5" value="${st.kg}" aria-label="무게">kg</label>
      <label class="field"><input type="number" inputmode="numeric" placeholder="${s.goal.split("~").pop()}" value="${st.reps}" aria-label="횟수">회</label>
      <button class="check">${st.done ? "완료" : "미완"}</button>`;
    const [kgIn, repsIn] = row.querySelectorAll("input");
    const btn = row.querySelector(".check");
    kgIn.addEventListener("input", () => { st.kg = kgIn.value; save(); });
    repsIn.addEventListener("input", () => { st.reps = repsIn.value; save(); });
    btn.addEventListener("click", () => {
      if (!st.done && !st.reps) { st.reps = s.goal.split("~").pop(); repsIn.value = st.reps; }
      st.done = !st.done;
      const now = new Date();
      st.at = st.done ? `${pad(now.getHours())}:${pad(now.getMinutes())}` : "";
      st.ts = st.done ? now.getTime() : 0;
      row.querySelector(".at").textContent = st.at ? st.at + " 완료" : "";
      row.classList.toggle("done", st.done);
      btn.textContent = st.done ? "완료" : "미완";
      save(); updateProgress();
    });
    setsEl.appendChild(row);
  });
  list.appendChild(card);
});

const memo = document.getElementById("memo");
memo.value = state.memo || "";
memo.addEventListener("input", () => { state.memo = memo.value; save(); });

function updateProgress() {
  const required = EXERCISES.flatMap(ex => ex.sets.map((s, i) => ({ s, k: `${ex.id}-${i}` }))).filter(x => !x.s.optional);
  const done = required.filter(x => state[x.k] && state[x.k].done).length;
  document.getElementById("bar").style.width = (done / required.length * 100) + "%";
  document.getElementById("plabel").textContent = `필수 ${required.length}세트 중 ${done}세트 완료`;
}
updateProgress();

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

document.getElementById("copy").addEventListener("click", async () => {
  const lines = [`${dateKey} 상체 B`];
  EXERCISES.forEach(ex => {
    const done = ex.sets.map((s, i) => state[`${ex.id}-${i}`]).filter(st => st && st.done);
    lines.push(`${ex.name.slice(2)}: ` + (done.length ? done.map(st => `${st.kg}kg×${st.reps || "?"}`).join(", ") : "안 함"));
  });
  const order = [];
  EXERCISES.forEach(ex => ex.sets.forEach((s, i) => {
    const st = state[`${ex.id}-${i}`];
    if (st && st.done) order.push({ ts: st.ts || 0, line: `${st.at || "?"} ${ex.name.slice(0, 1)} ${i + 1}세트 ${st.kg}kg×${st.reps || "?"}` });
  }));
  if (order.length) {
    lines.push("", "실제 순서");
    order.sort((a, b) => a.ts - b.ts).forEach(o => lines.push(o.line));
  }
  if (state.memo) lines.push("", "메모: " + state.memo);
  const text = lines.join("\n");
  try { await navigator.clipboard.writeText(text); toast("복사했어요. 대화창에 붙여 주세요"); }
  catch (e) { memo.value = text; memo.select(); toast("복사가 막혀서 메모 칸에 넣었어요. 길게 눌러 복사"); }
});

document.getElementById("reset").addEventListener("click", () => {
  if (!document.getElementById("reset").dataset.armed) {
    document.getElementById("reset").dataset.armed = "1";
    document.getElementById("reset").textContent = "한 번 더 누르면 초기화";
    setTimeout(() => { delete document.getElementById("reset").dataset.armed; document.getElementById("reset").textContent = "초기화"; }, 3000);
    return;
  }
  try { localStorage.removeItem(STORE); } catch (e) {}
  location.reload();
});
</script>
</body>
</html>
